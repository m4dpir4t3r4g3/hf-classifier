<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HF класификатор</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #f8fafc; --text: #18202c; --muted: #5b6575; --line: #dfe3ea;
  --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
  --sel: #fff4c2; --chip: #eef2f7; --dec: #86efac; --und: #fdba74; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f141b; --panel: #171e27; --panel2: #1c2430; --text: #e4e9f0; --muted: #96a1b2; --line: #2a3442;
          --accent: #60a5fa; --accent-text: #0b1220; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --sel: #3a3416; --chip: #222c39;
          --shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
button.icon { padding: 6px 10px; }
input, select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 8px; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
a { color: var(--accent); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }

/* Top bar */
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
.brand img { width: 26px; height: 26px; border-radius: 6px; }
.status { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: var(--chip); font-size: 13px; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.status.ok .dot { background: var(--ok); } .status.warn .dot { background: var(--warn); } .status.bad .dot { background: var(--bad); }
.status.busy .dot { background: var(--warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.top-actions { display: flex; gap: 8px; align-items: center; }

/* Banner */
.banner { margin: 14px 18px 0; padding: 14px 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line);
  border-left: 5px solid var(--warn); box-shadow: var(--shadow); }
.banner.bad { border-left-color: var(--bad); } .banner.info { border-left-color: var(--accent); }
.banner h2 { margin: 0 0 6px; font-size: 16px; }
.banner ol { margin: 6px 0 10px; padding-left: 22px; } .banner li { margin: 3px 0; }
.banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }

main { padding: 14px 18px 24px; display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card > .head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.card > .head h2 { margin: 0; font-size: 14px; font-weight: 650; }
.card > .body { padding: 12px 14px; }

/* Receivers */
.rx .head .info { color: var(--muted); font-size: 13px; }
.lane { position: relative; height: 30px; margin: 0 14px; }
.bar { position: absolute; top: 4px; height: 22px; border-radius: 4px; font: 11px/22px var(--mono); padding: 0 4px; white-space: nowrap;
  overflow: hidden; cursor: pointer; color: #111; min-width: 4px; border: 1px solid rgba(0,0,0,.15); }
.bar.dec { background: var(--dec); } .bar.und { background: var(--und); }
.bar.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 2; }
.bar.narrow { padding: 0; }
.lanetag { position: absolute; top: 7px; z-index: 3; background: var(--panel); padding: 0 3px; border-radius: 3px; font: 11px/16px var(--mono); color: var(--muted); white-space: nowrap; pointer-events: none; }
.marks { position: relative; height: 40px; margin: 4px 14px 0; overflow: hidden; }
.mark { position: absolute; height: 17px; font: 11px/17px var(--sans, system-ui); padding: 0 5px; border-radius: 3px 3px 3px 0; white-space: nowrap;
  cursor: pointer; color: #10202e; border-left: 2px solid rgba(0,0,0,.55); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.mark.tick { width: 0; padding: 0; top: 30px; height: 10px; border-radius: 0; }
.mark.ut { background: #7dd3fc; } .mark.bc { background: #cbd5e1; } .mark.ts { background: #fde68a; } .mark.ot { background: #c4b5fd; }
.mark.off { opacity: .45; } .mark:hover { outline: 2px solid var(--accent); z-index: 3; }
.mark.my { background: #fcd34d; border-left-color: #92400e; font-weight: 600; }
.dlitems div { font-size: 13px; } .dlitems .ok { color: var(--ok); } .dlitems .bad { color: var(--bad); }
.rec[hidden] { display: none; }
.rec { display: inline-flex; align-items: center; gap: 8px; color: var(--bad); font-weight: 600; font-size: 13px; }
.rec i { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
dialog.big { width: min(900px, calc(100vw - 32px)); }
.dbrow { display: flex; gap: 10px; align-items: center; padding: 4px 0; }
.dbrow .n { color: var(--muted); font-size: 13px; }
.found { margin-top: 8px; max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.found div { display: flex; gap: 10px; padding: 4px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.found div:hover { background: var(--panel2); } .found .f { font-family: var(--mono); min-width: 84px; text-align: right; }
.found .src { color: var(--muted); margin-left: auto; white-space: nowrap; }
.task { border-top: 1px solid var(--line); padding: 8px 0; }
.task .thead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.task .thead b { font-weight: 650; } .task .have { color: var(--muted); font-size: 13px; } .task .have.done { color: var(--ok); }
.fq { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.fq button { padding: 2px 8px; font: 12px var(--mono); border-radius: 999px; background: var(--chip); }
.fq button.off { opacity: .5; }
.tasks h3 { font-size: 14px; margin: 16px 0 2px; } .tasks h3 + p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
a.pic { display: block; margin: 4px 0; } a.pic img { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; background: #fff; }
.usebar { display: grid; grid-template-columns: 260px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; margin: 2px 0; }
.usebar .b { height: 12px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.usebar .b i { display: block; height: 100%; background: var(--accent); }
.usebar .v { text-align: right; font-family: var(--mono); }
.restable td, .restable th { padding: 4px 8px; font-size: 13px; }
.restable td.dec { white-space: normal; max-width: 260px; color: var(--muted); }
.rescontrols { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; }
.rescontrols label { display: grid; gap: 3px; font-size: 13px; }
.decfams { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
.decfams label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.wfwrap { position: relative; margin: 0 14px; }
canvas.wf { width: 100%; height: 240px; display: block; border-radius: 6px; background: #050b16; cursor: crosshair; image-rendering: pixelated; }
.wfhint { position: absolute; left: 10px; bottom: 8px; color: #c8d3e3; font-size: 12px; background: rgba(5,11,22,.6); padding: 2px 8px; border-radius: 6px; pointer-events: none; }
.axis { position: relative; height: 22px; margin: 2px 14px 10px; font: 11px var(--mono); color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.15); }

/* Emissions + details */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.filters input[type=search] { min-width: 200px; flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 3px 11px; font-size: 13px; background: var(--chip); border: 1px solid transparent; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.tablewrap { max-height: 460px; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel2); font-weight: 600; font-size: 12px; color: var(--muted); z-index: 1; }
td.num { text-align: right; font-family: var(--mono); }
td.text { white-space: normal; font-family: var(--mono); min-width: 220px; max-width: 520px; color: var(--muted); }
tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--panel2); }
tr.sel td { background: var(--sel) !important; }
tr.ended td:not(.text) { color: var(--muted); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--dec); color: #0f2a17; }
ul.consistent { margin: 4px 0 2px; padding-left: 18px; font-size: 13px; }
ul.consistent li { margin: 2px 0; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.15); }
.swatch.dec { background: var(--dec); } .swatch.und { background: var(--und); }
.tag.und { background: var(--chip); color: var(--muted); font-weight: 500; }
.onair { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.empty { padding: 26px 14px; text-align: center; color: var(--muted); }

.details .freq { font: 600 24px/1.2 var(--mono); }
.details dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: 13px; }
.details dt { color: var(--muted); } .details dd { margin: 0; font-family: var(--mono); }
.details .textbox { font: 13px/1.5 var(--mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.details .listen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.details .listen label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.details .listen .wide { grid-column: 1 / -1; }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }

.log { font: 12.5px/1.55 var(--mono); max-height: 320px; overflow: auto; padding: 6px 14px; }
.log div { border-bottom: 1px dotted var(--line); padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
.log .time { color: var(--muted); }

/* Dialogs */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--text);
  width: min(620px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,15,25,.45); }
dialog .dhead { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
dialog .dhead h2 { margin: 0; font-size: 17px; flex: 1; }
dialog .dbody { padding: 14px 18px; max-height: 70vh; overflow: auto; }
dialog .dfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 14px; padding: 10px 14px 12px; }
legend { font-weight: 650; padding: 0 6px; }
.field { display: grid; gap: 4px; margin: 8px 0; align-content: start; }
.field > span { font-size: 13px; font-weight: 550; }
.field small { color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
.check small { display: block; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.formerr { color: var(--bad); font-size: 13px; min-height: 1.3em; }
.help h3 { font-size: 14px; margin: 14px 0 4px; } .help p, .help ul { margin: 4px 0 8px; } .help li { margin: 2px 0; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1f2937; color: #f9fafb; padding: 10px 18px;
  border-radius: 10px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 20; }
#toast.show { opacity: 1; } #toast.bad { background: #7f1d1d; }
.diaglog { max-height: 14em; overflow: auto; font-size: 12px; background: var(--panel); padding: .5em; white-space: pre; }
#diagResult a { word-break: break-all; }
button.loadchip { border: 0; cursor: pointer; font: inherit; font-size: 13px; color: inherit; }
button.loadchip[aria-expanded="true"] { outline: 2px solid var(--accent); }
.loadpanel { position: fixed; top: 58px; left: 18px; z-index: 40; width: min(680px, calc(100vw - 36px)); max-height: 72vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 14px 18px; }
.loadpanel h2 { margin: 0 0 8px; font-size: 16px; } .loadpanel h3 { margin: 12px 0 4px; font-size: 14px; }
.loadpanel .lag { color: var(--bad); font-weight: 600; }
.loadpanel .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ptag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.ptag.try { color: var(--text); border: 1px dashed var(--line); } .ptag.left { opacity: .75; }
.wins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.win { position: absolute; top: 0; bottom: 0; border-left: 1px solid; border-right: 1px solid; }
.win.dec { background: rgba(74,222,128,.13); border-color: rgba(74,222,128,.7); }
.win.none { background: repeating-linear-gradient(135deg, rgba(148,163,184,.28) 0 6px, rgba(148,163,184,.08) 6px 12px); border-color: rgba(148,163,184,.8); }
.win button { pointer-events: auto; position: absolute; top: 4px; left: 2px; max-width: calc(100% - 4px); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: rgba(5,11,22,.75); color: #e6edf6; border: 0; }
.dragsel { position: absolute; top: 0; bottom: 0; background: rgba(96,165,250,.25); border: 1px dashed #60a5fa; pointer-events: none; }
canvas.wf { cursor: crosshair; touch-action: pan-y; }
.winlist { display: grid; gap: 4px; margin: 4px 0 8px; } .winlist div { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.winlist span.f { font-family: var(--mono); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icon.png" alt=""><span data-t="appName"></span></div>
  <div id="status" class="status busy" role="status"><span class="dot"></span><span id="statusText"></span></div>
  <button id="loadChip" class="status loadchip" aria-expanded="false" aria-controls="loadPanel" hidden><span class="dot"></span><span id="loadText"></span></button>
  <div class="spacer"></div>
  <div class="top-actions">
    <select id="lang" aria-label="Language / Език">
      <option value="bg">Български</option>
      <option value="en">English</option>
    </select>
    <button id="openDb" data-t="freqs" data-t-title="freqsTip"></button>
    <button id="openTasks" data-t="tasks" data-t-title="tasksTip"></button>
    <button id="openSettings" class="icon" data-t-title="settings">⚙ <span data-t="settings"></span></button>
    <button id="openHelp" class="icon" data-t-title="help">? <span data-t="help"></span></button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="loadPanel" class="loadpanel" role="region" aria-labelledby="loadTitle" hidden></div>

<main>
  <div id="receivers"></div>

  <div class="split">
    <section class="card">
      <div class="head">
        <h2 data-t="emissions"></h2><span id="emCount" class="muted"></span>
        <div class="spacer"></div>
        <button id="searchLog" data-t="searchLog" data-t-title="searchLogTip"></button>
        <button id="export" data-t="export"></button>
      </div>
      <div class="filters">
        <input id="fText" type="search" data-t-placeholder="searchText">
        <label class="toggle"><input id="fActive" type="checkbox"> <span data-t="onAirOnly"></span></label>
        <div id="chips" class="chips"></div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr id="emHead"></tr></thead>
          <tbody id="emBody"></tbody>
        </table>
        <div id="emEmpty" class="empty"></div>
      </div>
    </section>

    <aside class="card details">
      <div class="head"><h2 data-t="selected"></h2></div>
      <div class="body" id="details"></div>
    </aside>
  </div>

  <section class="card">
    <div class="head"><h2 data-t="decodes"></h2><span class="muted" data-t="decodesNote"></span></div>
    <div id="log" class="log"></div>
    <div id="logEmpty" class="empty"></div>
  </section>
</main>

<dialog id="settingsDlg" aria-labelledby="settingsTitle">
  <form method="dialog" id="settingsForm">
    <div class="dhead"><h2 id="settingsTitle" data-t="settings"></h2></div>
    <div class="dbody">
      <fieldset>
        <legend data-t="sLanguage"></legend>
        <select name="language" class="field">
          <option value="" data-t="sLangAuto"></option>
          <option value="bg">Български</option>
          <option value="en">English</option>
        </select>
      </fieldset>
      <fieldset id="sdrSettings">
        <legend>SDRconnect</legend>
        <div class="row2">
          <label class="field"><span data-t="sHost"></span><input name="sdr_host" autocomplete="off" spellcheck="false"><small data-t="sHostNote"></small></label>
          <label class="field"><span data-t="sPort"></span><input name="sdr_port" type="number" min="1" max="65535"><small data-t="sPortNote"></small></label>
        </div>
        <label class="field"><span data-t="sTuner"></span>
          <select name="tuner">
            <option value="1" data-t="sTuner1"></option>
            <option value="2" data-t="sTuner2"></option>
            <option value="both" data-t="sTunerBoth"></option>
          </select>
        </label>
        <label class="field"><span data-t="sSerial"></span><input name="dual_serial" autocomplete="off" spellcheck="false"><small data-t="sSerialNote"></small></label>
        <label class="check"><input name="start_headless" type="checkbox"><span><span data-t="sHeadless"></span><small data-t="sHeadlessNote"></small></span></label>
        <label class="field"><span data-t="sHeadlessPath"></span><input name="headless_path" spellcheck="false" data-t-placeholder="sHeadlessPathAuto"></label>
      </fieldset>
      <fieldset>
        <legend data-t="sProgram"></legend>
        <label class="check"><input name="open_window" type="checkbox"><span><span data-t="sOpenWindow"></span><small data-t="sOpenWindowNote"></small></span></label>
        <label class="check"><input name="ft8" type="checkbox"><span><span data-t="sFt8"></span><small data-t="sAfterRestart"></small></span></label>
        <label class="field"><span data-t="sHttpPort"></span><input name="http_port" type="number" min="1" max="65535"><small data-t="sAfterRestart"></small></label>
        <p class="note"><span data-t="sDataFolder"></span> <span id="logPath" class="mono"></span></p>
        <p><button type="button" id="openDiag" data-t="diagOpen"></button> <small class="muted" data-t="diagOpenNote"></small></p>
      </fieldset>
      <fieldset id="procSettings">
        <legend data-t="sProcessing"></legend>
        <p class="note" data-t="sProcNote"></p>
        <div class="row2">
          <label class="field"><span data-t="resMax"></span><input name="max_sessions" type="number" min="1" max="500"></label>
          <label class="field"><span data-t="resGiveUp"></span><input name="give_up_seconds" type="number" min="0" max="86400"></label>
        </div>
        <label class="field"><span data-t="resMinSnr"></span><input name="min_snr_db" type="number" min="-20" max="60"></label>
        <label class="check"><input name="measure_unknown" type="checkbox"><span><span data-t="resUnknown"></span><small data-t="resUnknownTip"></small></span></label>
        <div class="note" data-t="resDecoders"></div>
        <div id="sFamilies" class="decfams"></div>
        <div class="note" data-t="sWindows"></div>
        <div id="sWindows" class="winlist"></div>
      </fieldset>
      <div id="settingsErr" class="formerr" role="alert"></div>
    </div>
    <div class="dfoot">

    // Units
    unitS: "с", unitMin: "мин", unitH: "ч", hzPerS: "Hz/s",
    helpHtml: `
      <h3>Какво прави програмата</h3>
      <p>Следи всичко, което приема SDRconnect, открива всяко излъчване в честотната лента и декодира видовете, които познава: FT8, FT4, NAVTEX/SITOR-B, RTTY, CW (морз), PSK31 до PSK500 (BPSK и QPSK) и ALE. Останалите излъчвания се показват с измерените честота, лента, сигнал/шум и продължителност. Всичко се записва в дневник.</p>
      <h3>Как да започна</h3>
      <ul><li>Стартирайте SDRconnect, пуснете приемника и включете WebSocket сървъра в настройките му (Preferences, раздел WebSocket Server).</li>
      <li>Тази програма се свързва сама. Ако SDRconnect не работи, тя може да го стартира без прозорец (Настройки).</li>
      <li>Щракнете върху излъчване, за да видите подробностите и да го чуете в SDRconnect.</li></ul>
      <h3>Цветове</h3>
      <ul><li><span class="swatch dec"></span> Зелено — декодирано: декодер е разпознал вида и е получил текст. FT8, FT4, NAVTEX и ALE имат и проверка за грешки; при CW, RTTY и PSK текстът може да съдържа грешки.</li>
      <li><span class="swatch und"></span> Оранжево — неразпознато: излъчването е засечено и измерено, но не е декодирано. За него таблицата показва измереното от сигнала („≈ 2-FSK, отместване 850 Hz, 75 бода“): вид модулация, брой тонове и разстояние между тях, скорост и, ако сигналът се повтаря, периодът му (рамката на модема). Това не е разпознаване — много системи използват един и същ вид модулация. В подробностите са изброени видовете от каталога, съвместими с измереното (с източника на параметрите им).</li>
      <li>Водопадът: по-светлото е по-силно; най-новото е най-отгоре.</li>
      <li>Списъци с честоти: сложете файлове с известни честоти (текст, CSV, dx.json от KiwiSDR, отметки от OpenWebRX) в подпапка frequencies на папката с данни и рестартирайте. Излъчванията на такава честота показват записаното за нея; то е указание, не разпознаване.</li></ul>
      <h3>Дневник и експорт</h3>
      <p>„Търсене в дневника“ търси във всички записани сесии. „Експорт“ дава таблица за Excel (CSV) или JSON.</p>
      <h3>Важно</h3>
      <p>Програмата само приема. Не предава, не дешифрира и не декодира криптирани съобщения. Спазвайте законите на своята страна за радиоприемане.</p>`,

let lang = "bg";
const L = () => T[lang];
const t = (k, ...a) => { const v = L()[k] ?? T.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };
const locale = () => (lang === "bg" ? "bg-BG" : "en-GB");
const fmtInt = (n) => new Intl.NumberFormat(locale()).format(Math.round(n));
const fmtNum = (n, d) => new Intl.NumberFormat(locale(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const fmtKhz = (hz) => fmtNum(hz / 1000, 3);
const fmtTime = (s) => (s ? new Date(s * 1000).toISOString().slice(11, 19) : "");
const fmtDateTime = (s) => (s ? new Date(s * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC" : "");
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec} ${t("unitS")}`;
  if (sec < 3600) return `${Math.floor(sec / 60)} ${t("unitMin")} ${sec % 60} ${t("unitS")}`;
  return `${Math.floor(sec / 3600)} ${t("unitH")} ${Math.floor((sec % 3600) / 60)} ${t("unitMin")}`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);

function applyTexts() {
  document.documentElement.lang = lang;
  document.title = t("appName");
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.querySelectorAll("[data-t-placeholder]").forEach((el) => (el.placeholder = t(el.dataset.tPlaceholder)));
  document.querySelectorAll("[data-t-title]").forEach((el) => (el.title = t(el.dataset.tTitle)));
  $("lang").value = lang;
  $("helpBody").innerHTML = t("helpHtml");
  $("emEmpty").textContent = t("noEmissions");
  $("logEmpty").textContent = t("noDecodes");
  renderHead();
  renderStatus();
  Object.values(state.receivers).forEach((r) => { renderRxTitle(r); drawAxis(r); drawLane(r); drawMarks(r); renderRec(r); });
  if ($("dbDlg").open) renderDb();
  if ($("tasksDlg").open) renderTasks();
  renderLoad();
  if ($("diagDlg").open) renderDiag();
  renderChips();
  renderTable();
  renderDetails();
  rerenderLog();
}

// ---------------------------------------------------------------- state --
const state = { receivers: {}, emissions: new Map(), texts: new Map(), seenDecodes: new Set(), decodes: [], labels: new Set(),
  selectedKey: null, selectedFree: null, filterLabel: "", mode: "live", searchRows: [], status: null, settings: null };
const key = (rx, id) => rx + ":" + id;

function setLanguage(l, save) {
  lang = l === "en" ? "en" : "bg";
  try { localStorage.setItem("hfc.lang", lang); } catch (e) { /* private window */ }
  applyTexts();
  if (save) send({ cmd: "settings", language: lang });
}
function initialLanguage() {
  try { const s = localStorage.getItem("hfc.lang"); if (s) return s; } catch (e) { /* none */ }
  return (navigator.language || "").toLowerCase().startsWith("bg") ? "bg" : "en";
}

// ---------------------------------------------------------- waterfall ---
const palette = (() => {
  const stops = [[0, [2, 6, 20]], [0.15, [8, 24, 90]], [0.35, [0, 110, 200]], [0.55, [40, 200, 140]], [0.75, [245, 215, 60]], [1, [255, 255, 255]]];
  const p = new Uint8Array(256 * 3);
  for (let v = 0; v < 256; v++) {
    const db = (v - 40) / 4, x = Math.min(1, Math.max(0, (db + 5) / 45));
    let i = 0; while (i < stops.length - 2 && x > stops[i + 1][0]) i++;
    const [x0, c0] = stops[i], [x1, c1] = stops[i + 1], f = (x - x0) / (x1 - x0);
    for (let k = 0; k < 3; k++) p[v * 3 + k] = Math.round(c0[k] + f * (c1[k] - c0[k]));
  }
  return p;
})();

function receiverView(rx) {
  let r = state.receivers[rx];
  if (r && r.el) return r;
  r = Object.assign(r || {}, { rx, lo: 0, hi: 0 });
  const sec = document.createElement("section");
  sec.className = "card rx";
  sec.innerHTML = `<div class="head"><h2></h2><span class="info"></span><div class="spacer"></div>
      <span class="rec" hidden><i></i><span class="rectext"></span><button class="recstop"></button></span>
      <div class="legend"><span><i style="background:var(--dec)"></i><span class="lgd"></span></span><span><i style="background:var(--und)"></i><span class="lgu"></span></span></div></div>
    <div class="marks"></div>
    <div class="lane"></div>
    <div class="wfwrap"><canvas class="wf" width="1024" height="240"></canvas><div class="wins"></div><div class="wfhint"></div></div>
    <div class="axis"></div>`;
  $("receivers").appendChild(sec);
  r.el = sec; r.title = sec.querySelector("h2"); r.info = sec.querySelector(".info"); r.lane = sec.querySelector(".lane");
  r.canvas = sec.querySelector("canvas"); r.ctx = r.canvas.getContext("2d"); r.axis = sec.querySelector(".axis");
  r.hint = sec.querySelector(".wfhint"); r.marks = sec.querySelector(".marks"); r.rec = sec.querySelector(".rec");
  r.wins = sec.querySelector(".wins");
  // Dragging across the waterfall marks a frequency window (windowDialog).
  const hzAt = (clientX) => { const b = r.canvas.getBoundingClientRect(); return r.lo + (clientX - b.left) / b.width * (r.hi - r.lo); };
  r.canvas.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0 || !(r.hi > r.lo)) return;
    r.drag = { x0: ev.clientX, x1: ev.clientX, on: false };
    r.canvas.setPointerCapture(ev.pointerId);
  });
  r.canvas.addEventListener("pointermove", (ev) => {
    const d = r.drag;
    if (!d) return;
    d.x1 = ev.clientX;
    if (!d.on && Math.abs(d.x1 - d.x0) > 6) { d.on = true; d.el = document.createElement("div"); d.el.className = "dragsel"; r.wins.appendChild(d.el); }
    if (d.on) {
      const b = r.canvas.getBoundingClientRect();
      d.el.style.left = (Math.min(d.x0, d.x1) - b.left) + "px";
      d.el.style.width = Math.abs(d.x1 - d.x0) + "px";
    }
  });
  const endDrag = (ev, use) => {
    const d = r.drag;
    r.drag = null;
    if (!d || !d.on) return;
    if (d.el) d.el.remove();
    r.suppressClick = true;
    if (use) {
      const a = hzAt(d.x0), z = hzAt(ev.clientX);
      openWindow(null, { lo: Math.round(Math.min(a, z)), hi: Math.round(Math.max(a, z)) });
    }
  };
  r.canvas.addEventListener("pointerup", (ev) => endDrag(ev, true));
  r.canvas.addEventListener("pointercancel", (ev) => endDrag(ev, false));
  sec.querySelector(".recstop").onclick = () => send({ cmd: "record", rx, stop: true });
  r.canvas.addEventListener("click", (ev) => {
    if (r.suppressClick) { r.suppressClick = false; return; }  // the end of a drag
    if (!(r.hi > r.lo)) return;
    const b = r.canvas.getBoundingClientRect();
    const hz = r.lo + (ev.clientX - b.left) / b.width * (r.hi - r.lo);
    let best = null, bestD = 1e18;
    for (const e of state.emissions.values()) {
      if (e.rx !== rx || e.event === "end") continue;
      const d = hz < e.lo ? e.lo - hz : hz > e.hi ? hz - e.hi : 0;
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best && bestD < (r.hi - r.lo) / 150) select(key(best.rx, best.id));
    else selectFree(rx, hz);
  });
  state.receivers[rx] = r;
  renderRxTitle(r);
  return r;
}

function renderRxTitle(r) {
  if (!r.el) return;
  const multi = Object.keys(state.receivers).length > 1;
  const name = state.status && state.status.mode === "playback" && r.name === "Playback" ? t("recording") : r.name === "Demo" ? t("demoName") : r.name;
  r.title.textContent = multi || name ? `${t("receiver", r.rx + 1)}${name ? " · " + name : ""}` : t("receiver", r.rx + 1);
  const parts = [];
  if (r.centre) parts.push(`${t("centreAt")} ${fmtKhz(r.centre)} kHz`);
  if (r.rate) parts.push(`${fmtNum(r.rate / 1e6, 3)} ${t("rate")}`);
  if (r.controllable === false && state.status && state.status.mode === "live") parts.push(t("viewOnly"));
  r.info.textContent = parts.join(" · ");
  r.hint.textContent = t("wfHint");
  r.el.querySelector(".lgd").textContent = t("legendDecoded");
  r.el.querySelector(".lgu").textContent = t("legendUnknown");
}

function drawAxis(r) {
  r.axis.innerHTML = "";
  if (!(r.hi > r.lo)) return;
  const span = r.hi - r.lo, steps = [1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5, 1e6];
  const step = steps.find((s) => span / s <= 10) || 2e6;
  for (let f = Math.ceil(r.lo / step) * step; f <= r.hi; f += step) {
    const s = document.createElement("span");
    s.style.left = ((f - r.lo) / span * 100) + "%";
    s.textContent = fmtNum(f / 1000, step < 1e4 ? 1 : 0);
    r.axis.appendChild(s);
  }
}

function waterfall(buf) {
  const dv = new DataView(buf);
  const rx = dv.getUint8(4), n = dv.getUint16(5, true);
  const lo = dv.getFloat64(15, true), hi = dv.getFloat64(23, true);
  const r = receiverView(rx);
  if (r.canvas.width !== n) r.canvas.width = n;
  if (lo !== r.lo || hi !== r.hi) { r.lo = lo; r.hi = hi; drawAxis(r); drawLane(r); loadMarkers(r); }
  const h = r.canvas.height;
  r.ctx.drawImage(r.canvas, 0, 0, n, h - 1, 0, 1, n, h - 1);
  const row = r.ctx.createImageData(n, 1), v = new Uint8Array(buf, 31, n);
  for (let i = 0; i < n; i++) {
    const c = v[i] * 3;
    row.data[4 * i] = palette[c]; row.data[4 * i + 1] = palette[c + 1]; row.data[4 * i + 2] = palette[c + 2]; row.data[4 * i + 3] = 255;
  }
  r.ctx.putImageData(row, 0, 0);
  if (r.hint.style.display !== "none" && state.emissions.size) r.hint.style.display = "none";
}

function drawLane(r) {
  if (!r || !r.lane || !(r.hi > r.lo)) return;
  r.lane.innerHTML = "";
  const span = r.hi - r.lo;
  const W = r.lane.clientWidth;
  // Left to right; a text that would run into the previous one is left out
  // (the bar's tooltip still has it).
  const list = [...state.emissions.values()].filter((e) => e.rx === r.rx && e.event !== "end").sort((a, b) => a.lo - b.lo);
  let textEnd = -Infinity;
  for (const e of list) {
    const b = document.createElement("div");
    const k = key(e.rx, e.id);
    b.className = "bar " + (e.label ? "dec" : "und") + (k === state.selectedKey ? " sel" : "");
    const left = (e.lo - r.lo) / span * 100, width = Math.max(0.35, (e.hi - e.lo) / span * 100);
    b.style.left = left + "%";
    b.style.width = width + "%";
    // Text inside the bar when it fits, else beside it.
    const text = e.label || fmtKhz(e.centre);
    const textPx = text.length * 7 + 10;
    const barPx = W * width / 100, barLeftPx = W * left / 100;
    if (barPx >= textPx) {
      if (barLeftPx >= textEnd) { b.textContent = text; textEnd = barLeftPx + barPx; }
    } else {
      b.classList.add("narrow");
      const at = barLeftPx + barPx + 4;
      if (at >= textEnd && at + textPx <= W + 40) {
        const tag = document.createElement("span");
        tag.className = "lanetag";
        tag.style.left = `${at}px`;
        tag.textContent = text;
        r.lane.appendChild(tag);
        textEnd = at + textPx;
      }
    }
    b.title = `${fmtKhz(e.centre)} kHz · ${fmtInt(e.hi - e.lo)} Hz · ${fmtNum(e.snr, 1)} dB${e.label ? " · " + e.label : ""}`;
    b.onclick = () => select(k);
    r.lane.appendChild(b);
  }
}


// ------------------------------------------- frequency databases ----
// Markers above the waterfall (as WebSDR and KiwiSDR sites show them), the
// databases window and its search, the recording tasks.
let dbOff = new Set(), onAirOnly = true, catOff = new Set();
try {
  dbOff = new Set(JSON.parse(localStorage.getItem("hfc.dbOff") || "[]")); onAirOnly = localStorage.getItem("hfc.onAirOnly") !== "0";
  catOff = new Set(JSON.parse(localStorage.getItem("hfc.catOff") || "[]"));
} catch (e) { /* defaults */ }
const catOf = (m) => (m.cat === undefined || !state.databases) ? null : (state.databases.categories || []).find((c) => c.key === m.cat) || null;
state.recording = {}; state.databases = null; state.tasks = null; state.canRecord = false;
const hhmm = (min) => String(Math.floor(min / 60)).padStart(2, "0") + String(min % 60).padStart(2, "0");
const markKind = (m) => (m.mode === "AM broadcast" ? "bc" : m.mode ? "ut" : /time signal/.test(m.label) ? "ts" : m.demod === "AM" ? "bc" : "ot");
const markTitle = (m) => `${fmtKhz(m.hz)} kHz · ${catOf(m) ? catOf(m).name + " · " : ""}${m.label || m.mode}${m.start !== undefined ? " · " + t("markHours", hhmm(m.start), hhmm(m.stop)) + " · " + (m.on ? t("markOn") : t("markOff")) : ""} · ${m.source}`;
const canControl = (r) => !!(r && r.controllable && state.status && state.status.mode !== "playback" && state.status.source_state === "connected");
const firstRx = () => Number(Object.keys(state.receivers)[0] || 0);

function loadMarkers(r) {
  if (!r || !(r.hi > r.lo)) return;
  const k = r.lo + ":" + r.hi;
  r.markKey = k;
  fetch(`/api/markers?lo_khz=${r.lo / 1000}&hi_khz=${r.hi / 1000}`).then((x) => x.json()).then((d) => {
    if (r.markKey !== k) return;
    r.markers = d.markers; drawMarks(r);
  }).catch(() => {});
}
// One marker per frequency and label (a schedule lists a station once per
// broadcast: the one on the air now stands for them).
function shownMarkers(list) {
  const by = new Map();
  for (const m of list || []) {
    if (dbOff.has(m.source)) continue;
    if (m.cat !== undefined && catOff.has(m.cat)) continue;
    const k = m.hz + "|" + m.label, old = by.get(k);
    if (!old || (m.on && !old.on)) by.set(k, m);
  }
  return [...by.values()].filter((m) => m.on || !onAirOnly).sort((a, b) => a.hz - b.hz);
}
function drawMarks(r) {
  if (!r || !r.marks) return;
  r.marks.innerHTML = "";
  if (!(r.hi > r.lo)) return;
  const W = r.marks.clientWidth, span = r.hi - r.lo, rowEnd = [-Infinity, -Infinity];
  for (const m of shownMarkers(r.markers)) {
    const x = (m.hz - r.lo) / span * W;
    if (x < 0 || x > W) continue;
    const el = document.createElement("div"), text = m.label || m.mode, w = Math.min(170, text.length * 6.3 + 12);
    const row = x >= rowEnd[0] ? 0 : x >= rowEnd[1] ? 1 : -1;
    el.className = "mark " + (m.source === "my markers" ? "my" : markKind(m)) + (m.on ? "" : " off") + (row < 0 ? " tick" : "");
    const cat = catOf(m);
    if (cat && cat.color && m.source !== "my markers") el.style.background = cat.color;
    el.style.left = x + "px";
    if (row >= 0) { el.style.top = (row ? 21 : 2) + "px"; el.textContent = text; rowEnd[row] = x + w + 3; }
    el.title = markTitle(m);
    el.onclick = () => goTo(r.rx, m);
    r.marks.appendChild(el);
  }

// ------------------------------------------------- frequency windows ----
// The user's windows (decode_windows.json): a decoder for the signals in

state.windows = []; state.decoderNames = [];

  fetch("/api/windows").then((x) => x.json()).then((d) => {
    state.windows = d.windows || []; state.decoderNames = d.decoders || []; state.canSaveWindows = !!d.can_save;

function drawWindows(r) {
  if (!r || !r.wins) return;
  r.wins.querySelectorAll(".win").forEach((x) => x.remove());
  if (!(r.hi > r.lo)) return;
  for (const w of state.windows) {
    if (w.hi_hz < r.lo || w.lo_hz > r.hi) continue;
    const a = Math.max(0, (w.lo_hz - r.lo) / (r.hi - r.lo)), z = Math.min(1, (w.hi_hz - r.lo) / (r.hi - r.lo));
    const el = document.createElement("div");
    el.className = "win " + (w.decoder === "none" ? "none" : "dec");
    el.style.left = (100 * a) + "%"; el.style.width = (100 * (z - a)) + "%";
    const b = document.createElement("button");
    b.textContent = winText(w);
    b.title = `${fmtKhz(w.lo_hz)}–${fmtKhz(w.hi_hz)} kHz · ${winText(w)}`;
    b.onclick = (ev) => { ev.stopPropagation(); openWindow(w); };
    el.appendChild(b);
    r.wins.appendChild(el);
  }
}
function decoderOptions(sel, current, first) {
  const names = [...state.decoderNames];
  if (current && !names.includes(current) && current !== "none" && current !== "rtty") names.push(current);
  sel.innerHTML = first.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("") +
    names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.value = current || first[0][0];
}
let winEditing = null, winSaving = null;
function openWindow(w, defaults) {
  if (!state.canSaveWindows) { toast(t("e_not_available"), true); return; }
  winEditing = w;
  const f = $("winForm"), v = w || defaults || {};
  $("winTitle").textContent = t(w ? "winTitleEdit" : "winTitleNew");
  f.lo.value = v.lo_hz !== undefined ? (v.lo_hz / 1000).toFixed(3) : (v.lo / 1000).toFixed(3);
  f.hi.value = v.hi_hz !== undefined ? (v.hi_hz / 1000).toFixed(3) : (v.hi / 1000).toFixed(3);
  decoderOptions(f.decoder, v.decoder || "none", [["none", t("winNone")], ["rtty", t("winRttyOther")]]);
  const syncRtty = () => { $("winRtty").hidden = f.decoder.value !== "rtty"; };
  f.decoder.onchange = syncRtty; syncRtty();

}
$("winForm").addEventListener("submit", (ev) => {
  if (ev.submitter && ev.submitter.value !== "save") return;
  ev.preventDefault();

  if (decoder === "rtty") decoder = `RTTY ${Number(f.baud.value)}/${Math.round(Number(f.shift.value))}`;
  winSaving = "save";
  send(Object.assign({ cmd: "window_save", lo_hz: Math.round(Number(f.lo.value) * 1000), hi_hz: Math.round(Number(f.hi.value) * 1000), decoder },
    winEditing ? { id: winEditing.id } : {}));
});
$("winDelete").onclick = () => { if (winEditing) { winSaving = "delete"; send({ cmd: "window_delete", id: winEditing.id }); } };
function renderWindowList() {
  const box = $("sWindows");

  box.innerHTML = [...state.windows].sort((a, b) => a.lo_hz - b.lo_hz).map((w) =>
    `<div><span class="f">${fmtKhz(w.lo_hz)}–${fmtKhz(w.hi_hz)} kHz</span><span>${esc(winText(w))}</span>` +
    `<button type="button" data-win="${esc(w.id)}">${esc(t("winEditBtn"))}</button></div>`).join("");
  box.querySelectorAll("[data-win]").forEach((b) => (b.onclick = () => openWindow(state.windows.find((x) => x.id === b.dataset.win))));
}
// Sets SDRconnect to a listed frequency: its demodulator, filter and VFO,
// after moving the band there when the frequency is outside it.
function goTo(rx, m) {
  const r = state.receivers[rx];
  if (!r) return;
  const mode = m.demod || "USB", bw = mode === "CW" ? 500 : mode === "AM" ? 8000 : 3000;
  const box = $("details");
  box.dataset.mode = mode; box.dataset.bw = bw; delete box.dataset.bwSet;
  state.selectedKey = null; state.selectedFree = { rx, centre: m.hz, marker: m }; selectedRow = null;
  Object.values(state.receivers).forEach(drawLane);
  renderTable(); renderDetails();
  if (!canControl(r)) { toast(t("markNoControl")); return; }
  const listen = () => { pending.listen = { f: fmtKhz(m.hz), m: mode }; send({ cmd: "listen", rx, freq: m.hz, mode, bw, dial: 1 }); };
  const margin = (r.hi - r.lo) * 0.05;
  if (r.hi > r.lo && m.hz > r.lo + margin && m.hz < r.hi - margin) { listen(); return; }
  // The band's centre a little above, so that the signal is clear of it.
  const centre = Math.round(m.hz + Math.min((r.rate || 0) / 5, 20000));
  pending.tune = fmtKhz(centre);
  send({ cmd: "tune", rx, centre });
  setTimeout(listen, 900);
}

function loadDatabases() { fetch("/api/databases").then((x) => x.json()).then((d) => { state.databases = d; if ($("dbDlg").open) renderDb(); }).catch(() => {}); }
let dbFound = null, dbQuery = "";

    }, 250);

}

  if (e) {
    const onAir = e.event !== "end";
    html += `<div style="margin-top:4px">${e.label ? '<span class="tag">' + esc(e.label) + "</span>" : '<span class="tag und">' + esc(t("unrecognised")) + "</span>"} ` +
      `<span class="muted">${onAir ? '<span class="onair"></span>' + esc(t("dOnAir")) : esc(t("dEnded"))}</span></div>`;
    const ft = featuresText(e.features);
    html += `<dl>` + (ft ? `<dt>${esc(t("dMeasured"))}</dt><dd title="${esc(t("measuredTip"))}">${esc(ft)}</dd>` : "") +
      `<dt>${esc(t("dOcc"))}</dt><dd>${fmtInt(occupied(e))} Hz</dd>` +
      `<dt>${esc(t("dDet"))}</dt><dd>${fmtInt(e.hi - e.lo)} Hz</dd>` +
      `<dt>${esc(t("dSnr"))}</dt><dd>${fmtNum(e.snr, 1)} / ${fmtNum(e.peak, 1)} dB</dd>` +
      `<dt>${esc(t("dDur"))}</dt><dd>${fmtDur(e.end - e.start)}</dd>` +
      `<dt>${esc(t("dDuty"))}</dt><dd>${fmtInt((e.duty || 0) * 100)} %</dd>` +
      `<dt>${esc(t("dDrift"))}</dt><dd>${fmtNum(e.drift || 0, 2)} ${esc(t("hzPerS"))}</dd>` +
      `<dt>${esc(t("dStart"))}</dt><dd>${fmtDateTime(e.start)}</dd>` +
      (onAir ? "" : `<dt>${esc(t("dEnd"))}</dt><dd>${fmtDateTime(e.end)}</dd>`) + "</dl>";
    const text = state.texts.get(key(e.rx, e.id)) || "";
    if (ft && !e.label) html += `<p class="note">${esc(t("measuredNote"))}</p>`;
    const cons = (!e.label && e.features && e.features.consistent) || [];
    if (cons.length) {
      html += `<div class="note">${esc(t("dConsistent"))}</div><ul class="consistent">` +
        cons.map((c) => `<li>${esc(c.mode)} <span class="muted">(${esc(t("prov_" + c.provenance) || c.provenance)}${c.partial ? "; " + esc(t("partialMatch")) : ""}${c.frame ? "; " + esc(t("frameMatch")) : ""}${c.listed ? "; " + esc(t("listedMatch")) : ""})</span></li>`).join("") +
        `</ul><p class="note">${esc(t("consistentNote"))}</p>`;
    }
    const pr = !e.label && e.features && e.features.predicted;
    if (pr) {
      const fam = t("fam_" + pr.family), pct = fmtInt(100 * pr.confidence);
      html += `<div class="note">${esc(t("dModel"))}</div><p title="${esc(pr.model || "")}">${esc(pr.sure ? t("modelSure", fam, pct) : t("modelUnsure", fam, pct))}</p>` +
        `<p class="note">${esc(t("modelNote"))}</p>`;
    }
    const listed = (e.features && e.features.listed) || [];
    if (listed.length) {
      html += `<div class="note">${esc(t("dListed"))}</div><ul class="consistent">` +
        listed.map((l) => `<li>${fmtNum(l.khz, 1)} kHz: ${esc(l.label || l.mode)} <span class="muted">(${esc(l.source)})</span></li>`).join("") +
        `</ul><p class="note">${esc(t("listedNote"))}</p>`;
    }
    html += procHtml(e);
    html += `<div class="note">${esc(t("dText"))}</div><div class="textbox">${text ? textHtml(text) : '<span class="muted">' + esc(t("dNoText")) + "</span>"}</div>`;
  }
  const mode = box.dataset.mode || "USB";
  html += `<div class="listen">
      <label>${esc(t("mode"))}<select id="dMode">${["USB", "LSB", "CW", "AM"].map((m) => `<option ${m === mode ? "selected" : ""}>${m}</option>`).join("")}</select></label>
      <label>${esc(t("bandwidth"))}<input id="dBw" type="number" min="100" max="12000" step="100" value="${esc(box.dataset.bw || (mode === "CW" ? 500 : 3000))}"></label>
      <button id="dListen" class="primary wide" ${can ? "" : "disabled"}>${esc(t("listen"))}</button>
      <button id="dCentre" class="wide" ${can ? "" : "disabled"}>${esc(t("centre"))}</button>
      <button id="dMarker" class="wide">${esc(myMarkerOf(mk) ? t("myEditThis") : t("mySave"))}</button>
      <button id="dRecord" class="wide" ${state.canRecord && !(state.recording[rx] && state.recording[rx].active) ? "" : "disabled"} title="${esc(state.canRecord ? t("tasksHow") : t("recOff"))}">${esc(t("recordThis", 2, taskTitle(taskFor(e, mk))))}</button>
    </div>
    <p class="note">${esc(can ? t("listenNote") : playback ? t("playbackNoControl") : t("cannotControl"))}</p>`;
  box.innerHTML = html;
  $("dMode").onchange = () => { box.dataset.mode = $("dMode").value; if ($("dMode").value === "CW" && !box.dataset.bwSet) $("dBw").value = 500; };
  $("dBw").onchange = () => { box.dataset.bw = $("dBw").value; box.dataset.bwSet = "1"; };
  $("dListen").onclick = () => {
    const m = $("dMode").value, bw = Number($("dBw").value) || 3000;
    pending.listen = { f: fmtKhz(centre), m };
    send(Object.assign({ cmd: "listen", rx, freq: centre, mode: m, bw }, mk ? { dial: 1 } : {}));
  };
  $("dRecord").onclick = () => startRecording(rx, taskFor(e, mk), centre, 120);
  $("dMarker").onclick = () => { const mine = myMarkerOf(mk); if (mine) openMarker(mine); else openMarker(null, markerDefaults(e, free)); };
  $("dCentre").onclick = () => { pending.tune = fmtKhz(centre); send({ cmd: "tune", rx, centre: Math.round(centre) }); };
  const stop = $("dStop");
  if (stop && e) stop.onclick = () => { stop.disabled = true; send({ cmd: "ignore", rx: e.rx, id: e.id }); };
}

// --------------------------------------------------------------- log ----
// Decoded text as HTML: "[picture NAME]" (a received radiofax) becomes
// the picture, linked to itself at full size.
function textHtml(text) {
  return esc(text).replace(/\[picture ([A-Za-z0-9._-]+)\]/g, (m, name) => `<a class="pic" href="/pictures/${name}" target="_blank" rel="noopener"><img src="/pictures/${name}" alt="${esc(t("picture"))}" loading="lazy"></a>`);
}
function logLine(d) {
  const div = document.createElement("div");
  div.innerHTML = `<span class="time">${fmtTime(d.utc)}</span> <span class="tag">${esc(d.decoder)}</span> ${fmtKhz(d.freq)} ${textHtml(d.text)}`;
  return div;
}
function rerenderLog() {
  const log = $("log");
  log.innerHTML = "";
  for (let i = state.decodes.length - 1; i >= 0 && log.childNodes.length < 1000; i--) log.appendChild(logLine(state.decodes[i]));
  $("logEmpty").hidden = state.decodes.length > 0;
}

// ---------------------------------------------------------- messages ----
const pending = {};
function onMessage(m) {
  if (m.type === "status") {
    state.status = m;
    if (m.settings) state.settings = m.settings;
    // The language: the settings', else the system's (first visit).
    let stored = null; try { stored = localStorage.getItem("hfc.lang"); } catch (e) { /* none */ }
    const wanted = (m.settings && m.settings.language) || stored || m.system_language || lang;
    if (wanted !== lang) setLanguage(wanted, false);
    for (const r of m.receivers) {
      const v = receiverView(r.rx);
      Object.assign(v, { name: r.name, controllable: r.controllable, centre: r.centre, rate: r.rate });
      renderRxTitle(v);
    }
    renderHead(); renderStatus(); renderDetails();
  } else if (m.type === "emission") {
    const k = key(m.rx, m.id), old = state.emissions.get(k);
    if (old && old.event === "end" && m.event !== "end") return;  // a stale snapshot entry
    if (old && old.label && !m.label) m.label = old.label;
    if (old && old.features && !m.features) m.features = old.features;
    state.emissions.set(k, m);
    if (m.label && !state.labels.has(m.label)) { state.labels.add(m.label); renderChips(); }
    if (state.emissions.size > 2000) {
      let n = 0;
      for (const [kk, e] of state.emissions) {
        if (e.event !== "end" || kk === state.selectedKey) continue;
        state.emissions.delete(kk); state.texts.delete(kk);
        if (++n >= 200) break;
      }
    }
    drawLane(state.receivers[m.rx]);
    renderTableSoon();
    if (k === state.selectedKey) renderDetailsSoon();
  } else if (m.type === "decode") {
    const k = key(m.rx, m.id), dk = k + "|" + m.utc + "|" + m.decoder + "|" + m.text;
    if (state.seenDecodes.has(dk)) return;
    state.seenDecodes.add(dk);
    if (state.seenDecodes.size > 5000) state.seenDecodes = new Set(Array.from(state.seenDecodes).slice(-2500));
    state.texts.set(k, ((state.texts.get(k) || "") + " " + m.text).trim());
    const e = state.emissions.get(k);
    if (e && !e.label && m.first) { e.label = m.decoder; drawLane(state.receivers[m.rx]); }
    if (!state.labels.has(m.decoder)) { state.labels.add(m.decoder); renderChips(); }
    state.decodes.push(m);
    if (state.decodes.length > 1500) state.decodes.splice(0, 500);
    const log = $("log");
    log.insertBefore(logLine(m), log.firstChild);
    while (log.childNodes.length > 1000) log.removeChild(log.lastChild);
    $("logEmpty").hidden = true;
    renderTableSoon();
    if (k === state.selectedKey) renderDetailsSoon();
  } else if (m.type === "recording") {
    const was = state.recording[m.rx];
    state.recording[m.rx] = m;
    renderRec(state.receivers[m.rx]);
    if (was && was.active && !m.active) {
      const file = String(m.file || "").split(/[\\/]/).pop();
      toast(t("rec_" + (m.ended || "done"), file), m.ended === "cannot_write");
      loadTasks(); renderDetails();
    } else if (!was || was.active !== m.active) renderDetails();
  } else if (m.type === "download") {
    state.download = m;
    if ($("dbDlg").open) renderDb();
  } else if (m.type === "diagnostics") {
    onDiagnostics(m);
  } else if (m.type === "my_markers") {
    loadMyMarkers();
    loadWindows();  // a marker's decoder is a window too (and lists are read again)
  } else if (m.type === "windows") {
    loadWindows();
  } else if (m.type === "usage") {
    onUsage(m);
  } else if (m.type === "databases") {
    state.databases = m;
    Object.values(state.receivers).forEach(loadMarkers);
    loadTasks();
    if ($("dbDlg").open) renderDb();
  } else if (m.type === "result") {
    if (m.ok) {
      if (m.cmd === "record" && pending.record) { pending.record = false; toast(t("r_record")); }
      else if ((m.cmd === "marker_save" || m.cmd === "marker_delete") && markerSaving) {
        toast(t(markerSaving === "delete" ? "r_markerDel" : "r_marker")); markerSaving = null; $("markerDlg").close();
      }
      else if (m.cmd === "reload_databases") { toast(t("r_reload")); loadWindows(); }
      else if ((m.cmd === "window_save" || m.cmd === "window_delete") && winSaving) {
        toast(t(winSaving === "delete" ? "r_winDel" : "r_win")); winSaving = null; $("winDlg").close();
      }
      else if (m.cmd === "ignore") toast(t("r_stopped"));
      else
if (m.cmd === "listen" && pending.listen) toast(t("r_listen", pending.listen.f, pending.listen.m));
      else if (m.cmd === "tune" && pending.tune) toast(t("r_tune", pending.tune));
      else if (m.cmd === "settings" && settingsSaving) { settingsSaving = false; $("settingsDlg").close(); toast(restartNeeded ? t("r_settingsRestart") : t("r_settings")); }
    } else {
      const [code, detail] = String(m.message || "").split(/:(.*)/s);
      const text = L()["e_" + code] !== undefined ? t("e_" + code, detail) : t("e_generic");
      if ((m.cmd === "marker_save" || m.cmd === "marker_delete") && markerSaving) { markerSaving = null; $("markerErr").textContent = text; }
      else if ((m.cmd === "window_save" || m.cmd === "window_delete") && winSaving) { winSaving = null; $("winErr").textContent = text; }
      else if (m.cmd === "settings" && settingsSaving) { settingsSaving = false; $("settingsErr").textContent = text; }
      else if (m.cmd === "diagnostics") { diag = { state: "failed", message: text, lines: [] }; renderDiag(); }
      else toast(text, true);
    }
  }
}
let detailsTimer = null;
function renderDetailsSoon() { if (!detailsTimer) detailsTimer = setTimeout(() => { detailsTimer = null; renderDetails(); }, 400); }

let toastTimer = null;
function toast(text, bad) {
  const el = $("toast");
  el.textContent = text; el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.className = ""), 4500);
}

// -------------------------------------------------- diagnostic report ----
let diag = null;  // { state: running | done | failed, lines, file, path, message }
function openDiag() {
  if ($("settingsDlg").open) $("settingsDlg").close();
  renderDiag();
  $("diagDlg").showModal();
}
function onDiagnostics(m) {
  if (m.state === "running") diag = { state: "running", lines: [] };
  else if (m.state === "line") { if (!diag) diag = { state: "running", lines: [] }; diag.lines.push(m.line); }
  else if (m.state === "done") diag = Object.assign(diag || { lines: [] }, { state: "done", file: m.file, path: m.path });
  else if (m.state === "failed") diag = Object.assign(diag || { lines: [] }, { state: "failed", message: m.message });
  if ($("diagDlg").open) renderDiag();
}
function renderDiag() {
  const running = diag && diag.state === "running";
  $("diagMake").disabled = running;
  $("diagRates").disabled = running || !(state.status && state.status.mode === "live");
  const log = $("diagLog");
  log.hidden = !diag || !diag.lines.length;
  if (diag) { log.textContent = diag.lines.join("\n"); log.scrollTop = log.scrollHeight; }
  const r = $("diagResult");
  $("diagFolder").hidden = !diag || diag.state !== "done";
  if (!diag) r.innerHTML = "";
  else if (running) r.innerHTML = `<p>${esc(t("diagRunning"))}</p>`;
  else if (diag.state === "done")
    r.innerHTML = `<p>${esc(t("diagDone"))}</p><p class="mono">${esc(diag.path || "")}</p>` +
      `<p><a class="primary" href="/reports/${encodeURIComponent(diag.file)}" download><button class="primary" tabindex="-1">${esc(t("diagDownload"))}</button></a></p>`;
  else r.innerHTML = `<p class="formerr">${esc(t("diagFailed", diag.message || ""))}</p>`;
}
$("openDiag").onclick = openDiag;
$("closeDiag").onclick = () => $("diagDlg").close();
$("diagFolder").onclick = () => send({ cmd: "open_folder", which: "reports" });
$("diagMake").onclick = () => {
  diag = { state: "running", lines: [] };
  renderDiag();
  send({ cmd: "diagnostics", rates: $("diagRates").checked ? "1" : "0" });
};

// ---------------------------------------------------------- settings ----
let settingsSaving = false, restartNeeded = false;
function openSettings(section) {
  const s = state.settings;
  if (!s) return;
  const f = $("settingsForm");
  f.max_sessions.value = s.max_sessions ?? 48; f.give_up_seconds.value = s.give_up_seconds ?? 120; f.min_snr_db.value = s.min_snr_db ?? 0;
  f.measure_unknown.checked = s.measure_unknown !== false;
  const off = new Set(String(s.disabled_decoders || "").split(",").filter((x) => x));
  $("sFamilies").innerHTML = FAMILIES.map((fam) => `<label><input type="checkbox" data-fam="${esc(fam)}" ${off.has(fam) ? "" : "checked"}> ${esc(fam)}</label>`).join("");
  f.language.value = s.language || "";
  f.sdr_host.value = s.sdr_host; f.sdr_port.value = s.sdr_port; f.tuner.value = s.tuner; f.dual_serial.value = s.dual_serial;
  f.start_headless.checked = s.start_headless; f.headless_path.value = s.headless_path;
  f.open_window.checked = s.open_window; f.ft8.checked = s.ft8; f.http_port.value = s.http_port;
  $("sdrSettings").disabled = state.status && state.status.mode === "playback";
  $("logPath").textContent = (state.status && state.status.log) || "";
  $("settingsErr").textContent = "";
  renderWindowList();
  $("settingsDlg").showModal();
  if (section === "processing") $("procSettings").scrollIntoView({ block: "start" });
}
$("settingsForm").addEventListener("submit", (ev) => {
  if (ev.submitter && ev.submitter.value !== "save") return;
  ev.preventDefault();
  const f = $("settingsForm"), s = state.settings || {};
  const cmd = { cmd: "settings", language: f.language.value, sdr_host: f.sdr_host.value.trim(), sdr_port: String(f.sdr_port.value),
    tuner: f.tuner.value, dual_serial: f.dual_serial.value.trim(), start_headless: f.start_headless.checked,
    headless_path: f.headless_path.value.trim(), open_window: f.open_window.checked, ft8: f.ft8.checked, http_port: String(f.http_port.value),
    // Processing: in effect as soon as saved, without a restart.
    max_sessions: String(f.max_sessions.value), give_up_seconds: String(f.give_up_seconds.value), min_snr_db: String(f.min_snr_db.value),
    measure_unknown: f.measure_unknown.checked,
    disabled_decoders: [...$("sFamilies").querySelectorAll("[data-fam]")].filter((x) => !x.checked).map((x) => x.dataset.fam).join(",") };
  restartNeeded = cmd.ft8 !== s.ft8 || Number(cmd.http_port) !== s.http_port;
  // Only what was changed: the rest stays as in the settings file (which
  // may differ from what this run uses, given options on its command line).
  for (const k of Object.keys(cmd)) if (k !== "cmd" && String(cmd[k]) === String(s[k] ?? "")) delete cmd[k];
  settingsSaving = true;
  $("settingsErr").textContent = "";
  send(cmd);
  if (f.language.value) setLanguage(f.language.value, false);
  else { try { localStorage.removeItem("hfc.lang"); } catch (e) { /* none */ } setLanguage((state.status && state.status.system_language) || lang, false); }
});

// --------------------------------------------------------------- wiring --
$("lang").onchange = () => setLanguage($("lang").value, true);
$("openSettings").onclick = () => openSettings();
$("openHelp").onclick = () => $("helpDlg").showModal();
$("closeHelp").onclick = () => $("helpDlg").close();
$("export").onclick = () => { updateExport(); $("exportDlg").showModal(); };
$("closeExport").onclick = () => $("exportDlg").close();
$("fText").addEventListener("input", () => { renderTable(); updateExport(); });
$("fActive").addEventListener("change", renderTable);
$("searchLog").onclick = async () => {
  if (state.mode === "search") { state.mode = "live"; renderTable(); return; }
  const q = queryString();
  const res = await fetch("/api/emissions?limit=2000" + (q ? "&" + q : ""));
  state.searchRows = (await res.json()).map((e) => Object.assign(e, { event: e.ended ? "end" : "update" }));
  state.mode = "search"; renderTable();
};

let ws = null, connectedToProgram = false;
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    connectedToProgram = true;
    // The program sends what is on the air and the recent decodes again.
    state.emissions.clear(); state.texts.clear(); state.seenDecodes.clear(); state.decodes = [];
    rerenderLog(); Object.values(state.receivers).forEach(drawLane); renderTable(); renderStatus();
  };
  ws.onclose = () => { connectedToProgram = false; renderStatus(); setTimeout(connect, 2000); };
  ws.onmessage = (ev) => { if (typeof ev.data === "string") onMessage(JSON.parse(ev.data)); else waterfall(ev.data); };
}

lang = initialLanguage();
applyTexts();
updateExport();
loadDatabases();
loadTasks();
loadMyMarkers();
loadWindows();
connect();
</script>
</body>
</html>
